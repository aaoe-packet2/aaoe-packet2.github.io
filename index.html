<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>連絡先</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f8f9fa;
    color:#333;
    font-family:"Noto Sans JP",sans-serif;
}

.container{
    text-align:center;
    line-height:1.8;
    padding:20px;
}

.discord{
    margin-bottom:24px;
}

iframe{
    border:none;
    border-radius:12px;
}

.address{
    display:block;
    margin-top:12px;
    font-size:1.1rem;
    font-weight:600;
    word-break:break-all;
    background:linear-gradient(
        90deg,
        #3b82f6,
        #6366f1,
        #8b5cf6,
        #d946ef,
        #ec4899,
        #3b82f6
    );
    background-size:200% auto;
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    animation:gradient 4s linear infinite;
}

.counter{
    margin-top:28px;
}

@keyframes gradient{
    from{
        background-position:0% center;
    }
    to{
        background-position:200% center;
    }
}
</style>
</head>

<body>

<div class="container">

    <span class="address">
        でぃすこーど
    </span>
    
    <div class="discord">
        <iframe
            title="discord user profile"
            width="340"
            height="120"
            frameborder="0"
            sandbox="allow-scripts"
            src="https://widgets.vendicated.dev/user?id=1426149011848429590&theme=dark&banner=true&full-banner=false&rounded-corners=true&discord-icon=true&badges=true&guess-nitro=true&">
        </iframe>
    </div>

    <span class="address">
        BTC → 1AtLt1Ne5BtpZ6UjZ7uSCfjgsVCzf21Akb
    </span>

    <span class="address">
        LTC → LTm923p4sneeDqhFi8Y22XHDmdqJBM3mBb
    </span>

</body>
</html>
